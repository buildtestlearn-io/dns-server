
services:
  dns-server:
    container_name: dns-server  # Explicit container name; useful for static references but limits reusability

    hostname: dns1  # Sets internal hostname; only useful in specific network scenarios (e.g., host-aware logging)

    image: technitium/dns-server:13.5.0  # Use a specific version for consistency; consider updating if security patches exist

    network_mode: "host"  # Allows the DNS server to bind directly to host ports (required for port 53 UDP/TCP on host)

    volumes:
      - config:/etc/dns  # Persist DNS server configuration and data; as an alternative you can use a bind mount for ease of use

    restart: unless-stopped  # Automatically restart container unless manually stopped; attempts persistence across reboots

volumes:
  config:  # Declares a named volume used to store persistent data for the DNS server
